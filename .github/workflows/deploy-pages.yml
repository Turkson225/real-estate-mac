name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare application source
        run: |
          mkdir -p .build
          unzip -q real-estate-routes-main.zip -d .build
          patch -d .build -p1 < github-pages.patch

      - name: Load public Supabase configuration
        run: |
          if [ -z "${VITE_SUPABASE_URL:-}" ]; then
            value=$(sed -n 's/^VITE_SUPABASE_URL=//p' .build/real-estate-routes-main/.env | head -n 1)
            value=${value#\"}; value=${value%\"}; value=${value#\'}; value=${value%\'}
            echo "VITE_SUPABASE_URL=$value" >> "$GITHUB_ENV"
          fi
          if [ -z "${VITE_SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            value=$(sed -n 's/^VITE_SUPABASE_PUBLISHABLE_KEY=//p' .build/real-estate-routes-main/.env | head -n 1)
            value=${value#\"}; value=${value%\"}; value=${value#\'}; value=${value%\'}
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$value" >> "$GITHUB_ENV"
          fi
          rm -f .build/real-estate-routes-main/.env

      - name: Check deployment secrets
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Add the VITE_SUPABASE_URL repository secret."; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Add the VITE_SUPABASE_PUBLISHABLE_KEY repository secret."; exit 1; }

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        working-directory: .build/real-estate-routes-main

      - name: Build the SPA
        run: npm run build
        working-directory: .build/real-estate-routes-main

      - name: Add GitHub Pages SPA fallback
        run: |
          cp .build/real-estate-routes-main/dist/client/index.html .build/real-estate-routes-main/dist/client/404.html
          touch .build/real-estate-routes-main/dist/client/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .build/real-estate-routes-main/dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
